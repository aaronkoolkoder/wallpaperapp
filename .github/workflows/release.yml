name: Release

# Publishes the installer when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Check the toolchain can build for macOS 26
        # The runner image ships Xcode 26 as the default, so nothing needs selecting — but this
        # verifies it rather than assuming. The previous version pointed xcode-select at
        # /Applications/Xcode_26.app, which has never existed (the images name them Xcode_26.6
        # and friends), and swallowed the failure with `|| true`. The build then ran against an
        # older SDK and failed with a wall of unrelated Sendable errors, because MTLDevice only
        # became Sendable in the macOS 26 SDK. Failing here says what is actually wrong.
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          sdk=$(xcrun --sdk macosx --show-sdk-version)
          echo "macOS SDK: $sdk"
          if [ "${sdk%%.*}" -lt 26 ]; then
            echo "::error::macOS SDK $sdk is too old. Package.swift targets macOS 26."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi

      - name: Cache vendored shader toolchain
        uses: actions/cache@v6
        with:
          path: |
            Vendor/install
            Sources/ShaderBridge/vendor
          key: shader-tools-${{ runner.os }}-${{ hashFiles('Scripts/vendor-shader-tools.sh') }}

      - name: Vendor shader toolchain
        # glslang and SPIRV-Cross are built from pinned tags rather than fetched as binaries.
        run: brew install cmake ninja && Scripts/vendor-shader-tools.sh

      - name: Test
        run: swift test

      - name: Install DMG layout tooling
        # Written straight into a .DS_Store rather than by scripting Finder, which needs
        # Automation permission and would hang on a runner with nobody to approve it.
        run: |
          python3 -m venv .dmgvenv
          .dmgvenv/bin/pip install --quiet ds_store mac_alias

      - name: Build installer
        run: DMG_PYTHON="$PWD/.dmgvenv/bin/python" Scripts/make-dmg.sh release

      - name: Verify the image mounts and contains a valid app
        run: |
          MOUNT=$(hdiutil attach dist/Diorama-*.dmg -nobrowse -readonly | grep -o '/Volumes/.*' | head -1)
          test -d "$MOUNT/Diorama.app" || { echo "app missing from image"; exit 1; }
          test -L "$MOUNT/Applications" || { echo "Applications symlink missing"; exit 1; }
          codesign -v "$MOUNT/Diorama.app"
          hdiutil detach "$MOUNT" -quiet

      - uses: actions/upload-artifact@v7
        with:
          name: Diorama-dmg
          path: dist/*.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.dmg
          generate_release_notes: true
          body: |
            ## Installing

            Download the `.dmg`, open it, and drag **Diorama** into **Applications**.

            **On first launch, right-click the app and choose Open.** This build is signed
            ad-hoc rather than with an Apple Developer ID, so macOS will warn that the developer
            cannot be verified. Right-click → Open lets you past it once, after which it opens
            normally. Double-clicking the first time will only offer to move it to the Bin.

            Requires macOS 26 (Tahoe) on Apple Silicon.
